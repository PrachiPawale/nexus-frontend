<div class="nexus-layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">N</div>

      <div>
        <h1>NEXUS</h1>
        <span>Personal Intelligence</span>
      </div>
    </div>

    <nav class="navigation">

      <a routerLink="/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">⌂</span>
        <span>Dashboard</span>
      </a>

      <a routerLink="/tasks"
         routerLinkActive="active">
        <span class="nav-icon">✓</span>
        <span>Tasks</span>
      </a>

      <a routerLink="/calendar"
         routerLinkActive="active">
        <span class="nav-icon">▣</span>
        <span>Calendar</span>
      </a>

      <a routerLink="/notes"
         routerLinkActive="active">
        <span class="nav-icon">▤</span>
        <span>Notes</span>
      </a>

      <a routerLink="/goals"
         routerLinkActive="active">
        <span class="nav-icon">◎</span>
        <span>Goals</span>
      </a>

    </nav>

    <div class="sidebar-bottom">

      <div class="system-status">
        <span class="status-dot"></span>

        <div>
          <strong>System Online</strong>
          <small>All services operational</small>
        </div>
      </div>

    </div>

  </aside>


  <!-- Main Content -->
  <main class="main-content">

    <!-- Top Bar -->
    <header class="topbar">

      <div class="topbar-title">
        <span class="topbar-label">NEXUS</span>
        <span class="separator">/</span>
        <span>Workspace</span>
      </div>

      <div class="topbar-actions">

        <button class="icon-button" title="Notifications">
          ♢
        </button>

        <div class="profile">
          <div class="profile-avatar">N</div>

          <div class="profile-info">
            <strong>Sakshi</strong>
            <span>Personal Workspace</span>
          </div>
        </div>

      </div>

    </header>


    <!-- Page -->
    <section class="page-container">

      <router-outlet></router-outlet>

    </section>

  </main>

</div>


<!-- NEXUS VOICE ASSISTANT -->

<div class="voice-assistant">

  <button
    class="voice-btn"
    [class.listening]="voiceService.isListening"
    (click)="toggleVoice()"
    title="Nexus Voice Assistant"
  >

    <span *ngIf="!voiceService.isListening">
      🎙️
    </span>

    <span *ngIf="voiceService.isListening">
      🔴
    </span>

  </button>


  <div
    class="voice-status"
    *ngIf="voiceService.isListening || voiceService.transcript"
  >

    <span *ngIf="voiceService.isListening">
      Listening...
    </span>

    <span *ngIf="!voiceService.isListening && voiceService.transcript">
      "{{ voiceService.transcript }}"
    </span>

  </div>

</div>
